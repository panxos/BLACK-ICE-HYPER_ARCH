# BLACK-ICE — controles locales bajo demanda
bind = SUPER SHIFT, F9, exec, ~/.local/bin/black-ice-control
bind = SUPER ALT, T, exec, ~/.local/bin/black-ice-control appearance
bind = SUPER ALT, W, exec, ~/.local/bin/black-ice-wallpapers
bindr = SUPER, SUPER_L, exec, ~/.local/bin/black-ice-launcher
source = ~/.config/hypr/obsidian-colors.conf
